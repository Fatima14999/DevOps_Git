name: Migration/New_release_pipeline
on:
  workflow_dispatch:
jobs:
  Stage-1:
    runs-on: ubuntu-latest
    concurrency:
      group: "${{ github.ref }}"
      cancel-in-progress: false
    if: github.event_type != 'pull_request'
    steps:
    - name: Zip files
      run: 7z u ${{ runner.temp }}/${{ github.run_id }}.zip ${{ github.workspace }}
    - name: buildAndPush
      run: docker build . --file "Dockerfile"
